name: Checks
on:
  push:
    # Validate feature branches here; deploy.yml calls these same checks on main
    # before publishing images, so a standalone main run would duplicate them.
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint -- --deny-warnings
      - run: npm run test -- --coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: web-coverage
          path: web/coverage/
          if-no-files-found: ignore
      - run: npm run build
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pinvoyager
          POSTGRES_PASSWORD: pinvoyager
          POSTGRES_DB: pinvoyager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinvoyager"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pinvoyager:pinvoyager@localhost:5432/pinvoyager
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - run: sudo apt-get update && sudo apt-get install -y libheif-dev libheif-plugin-libde265 libwebp-dev libimage-exiftool-perl pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo coverage -- --test-threads=1
      - name: Verify release authentication and operator CLI
        run: cargo test --release --test auth_build_mode --test admin_cli
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "false"
      - run: cargo llvm-cov report --lcov --output-path backend-coverage.lcov
        if: always()
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-coverage
          path: backend-coverage.lcov
          if-no-files-found: ignore

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Check bundled policy sources and link configuration
        run: |
          python3 ios/Scripts/bundle-legal.py --check
          python3 -m unittest discover -s ios/Scripts -p 'test_association.py'
      - name: Check Swift formatting
        run: swift format lint --strict --recursive ios/Sources ios/Tests ios/PinVoyager ios/PinVoyagerTests ios/PinVoyagerUITests
      - name: Test the native app and enforce aggregate coverage
        run: ios/Scripts/test.sh
      - name: Build the release app for Simulator
        run: >-
          xcodebuild build -project ios/PinVoyager.xcodeproj -scheme PinVoyager
          -configuration Release -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/.releaseDerivedData CODE_SIGN_IDENTITY=-
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-test-results
          path: ios/TestResults/
          retention-days: 7
          if-no-files-found: ignore
