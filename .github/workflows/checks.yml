name: Checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint -- --deny-warnings
      - run: npm run test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: web/coverage/
          if-no-files-found: ignore
      - run: npm run build
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pinvoyager
          POSTGRES_PASSWORD: pinvoyager
          POSTGRES_DB: pinvoyager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinvoyager"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pinvoyager:pinvoyager@localhost:5432/pinvoyager
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - run: sudo apt-get update && sudo apt-get install -y libheif-dev libheif-plugin-libde265 libwebp-dev libimage-exiftool-perl pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo coverage -- --test-threads=1
      - run: cargo llvm-cov report --lcov --output-path backend-coverage.lcov
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend-coverage.lcov
          if-no-files-found: ignore
