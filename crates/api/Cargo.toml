[package]
name = "pinvoyager-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pinvoyager_api"
path = "src/lib.rs"

[[bin]]
name = "pinvoyager-api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "sync",
    "time",
] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [
    "trace",
    "request-id",
    "util",
    "timeout",
    "limit",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.24.1", features = ["v7", "serde"] }

# D8: tokio-console is how a blocking task holding a worker thread becomes
# visible. Behind a feature flag so it never ships in a release build.
console-subscriber = { version = "0.5.0", optional = true }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }

[features]
tokio-console = ["dep:console-subscriber"]

[lints]
workspace = true
