[package]
name = "pinvoyager-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pinvoyager_api"
path = "src/lib.rs"

[[bin]]
name = "pinvoyager-api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "sync",
    "time",
] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [
    "trace",
    "request-id",
    "util",
    "timeout",
    "limit",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.24.1", features = ["v7", "serde"] }

# D8: tokio-console is how a blocking task holding a worker thread becomes
# visible. Behind a feature flag so it never ships in a release build.
console-subscriber = { version = "0.5.0", optional = true }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
# Pinned to 0.12, NOT 0.13. openidconnect 4 depends on oauth2 5, which is built
# against reqwest 0.12 — and a `&reqwest::Client` from 0.13 does not implement
# oauth2's `AsyncHttpClient`, so discovery will not typecheck against it. Two
# reqwest majors in the lock produce two client types that look identical and
# are not interchangeable. Do not bump this independently of openidconnect.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# `rust_crypto` is NOT a default feature. jsonwebtoken's defaults are `use_pem`
# alone, and with no backend the crate can neither sign nor verify — it panics
# at runtime rather than failing to build. Apple's client secret is the only
# JWT this service signs, so the panic would first appear on the first Apple
# sign-in, in whatever environment that happened to be.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
rand = "0.10"
base64 = "0.23.1"
url = "2.5.8"
sha2 = "0.11.0"
axum-extra = { version = "0.12.6", features = ["cookie"] }
async-trait = "0.1.92"
cookie = "0.18"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

[features]
tokio-console = ["dep:console-subscriber"]

[lints]
workspace = true
