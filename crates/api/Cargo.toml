[package]
name = "pinvoyager-api"
default-run = "pinvoyager-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pinvoyager_api"
path = "src/lib.rs"

[[bin]]
name = "pinvoyager-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "uuid", "chrono", "rust_decimal"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "sync",
    "time",
] }
tower = "0.5.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower-http = { version = "0.7.0", features = [
    "trace",
    "request-id",
    "util",
    "timeout",
    "limit",
] }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.24.1", features = ["v7", "serde"] }

# Optional Tokio runtime instrumentation for development; not enabled by default.
console-subscriber = { version = "0.5.0", optional = true }
# Apple may encode email_verified as a string in its signed ID token.
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls", "accept-string-booleans"] }
# Pinned to 0.12, NOT 0.13. openidconnect 4 depends on oauth2 5, which is built
# against reqwest 0.12 — and a `&reqwest::Client` from 0.13 does not implement
# oauth2's `AsyncHttpClient`, so discovery will not typecheck against it. Two
# reqwest majors in the lock produce two client types that look identical and
# are not interchangeable. Do not bump this independently of openidconnect.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# Enable the signing backend used by Apple client-secret JWTs. Without a
# backend, jsonwebtoken signing panics at runtime.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
rand = "0.10"
base64 = "0.23.1"
url = "2.5.8"
sha2 = "0.11.0"
axum-extra = { version = "0.12.6", features = ["cookie"] }
async-trait = "0.1.92"
cookie = "0.18"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
libheif-rs = { version = "2.7.0", default-features = false, features = ["v1_17"] }
webp = "0.3.1"
kamadak-exif = "0.6.1"
hex = "0.4.3"
rust_decimal = { version = "1.42.1", features = ["db-postgres"] }
tokio-util = { version = "0.7.19", features = ["io"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "testing"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio-stream = "0.1"
http-body-util = "0.1.5"
http-body = "1.1.0"

[features]
tokio-console = ["dep:console-subscriber"]

[lints]
workspace = true
