[workspace]
resolver = "3"
members = ["crates/api"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The blocking-in-async hazard from D8 is not something Clippy can see, but
# these catch the adjacent mistakes cheaply.
todo = "warn"
dbg_macro = "warn"
unwrap_used = "warn"

# Opt-in performance measurements only; normal development/test profiles stay unchanged.
[profile.photo-perf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
# Explicitly disable Cargo's implicit build-dependency debuginfo stripping:
# LLVM 22 can produce proc-macro dylibs macOS 27 refuses to load (rust #157750).
strip = "none"
