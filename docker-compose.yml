# Local development dependencies.
#
#   docker compose up -d              PostgreSQL + Collector + Jaeger, with
#                                     the service itself run via `cargo run`
#   docker compose --profile api up   Dependencies + the containerized service
#
# Values interpolate from .env if present (Compose reads it automatically);
# see .env.example for the full set and the defaults below for what you get
# without one.
name: pinvoyager

services:
  db:
    # Pinned to a major version on purpose. `:latest` moves under you, and a
    # major upgrade rewrites the on-disk format — the named volume below would
    # then refuse to start against a newer server with no obvious explanation.
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pinvoyager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinvoyager}
      POSTGRES_DB: ${POSTGRES_DB:-pinvoyager}
      # Enable PostgreSQL page checksums when initializing the data directory.
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      # Host port is configurable because a developer may already have a local
      # PostgreSQL on 5432. Change POSTGRES_PORT and the URL in .env together.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `$$` escapes Compose interpolation so the variables are expanded inside
      # the container, where POSTGRES_USER/DB are already set.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # initdb runs on the first boot of a fresh volume and takes a few seconds,
      # during which pg_isready briefly succeeds against the bootstrap server.
      start_period: 10s

  api:
    # Opt-in. `docker compose up` with no profile gives you development dependencies,
    # which is what you want while iterating with `cargo run`.
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        # Not `service_started`. Without the health check the service wins the
        # race often enough to look flaky and fails its first migration
        # against a database that is still doing initdb.
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      # The image ships no config.toml — that file points at a localhost
      # database and would be a fallback that hides a missing URL — so
      # everything the container needs is set here.
      #
      # Host is `db`, the Compose service name, not localhost: inside this
      # container localhost is the container itself.
      PINVOYAGER__DATABASE__URL: postgres://${POSTGRES_USER:-pinvoyager}:${POSTGRES_PASSWORD:-pinvoyager}@db:5432/${POSTGRES_DB:-pinvoyager}
      # Public callback origin is required even when providers are disabled.
      PINVOYAGER__AUTH__BASE_URL: ${PINVOYAGER__AUTH__BASE_URL:-http://localhost:8080}
      PINVOYAGER__DATABASE__MAX_CONNECTIONS: "10"
      PINVOYAGER__DATABASE__MIN_CONNECTIONS: "1"
      # Maximum seconds to wait for a free database connection.
      PINVOYAGER__DATABASE__ACQUIRE_TIMEOUT_SECS: "5"
      PINVOYAGER__SERVER__SHUTDOWN_TIMEOUT_SECS: "15"
      PINVOYAGER__SERVER__REQUEST_TIMEOUT_SECS: "30"
      PINVOYAGER__TELEMETRY__LOG_LEVEL: "info,pinvoyager_api=debug"
      PINVOYAGER__TELEMETRY__JSON: "true"
      PINVOYAGER__TELEMETRY__OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
      PINVOYAGER__TELEMETRY__SERVICE_NAME: "pinvoyager-api"
      # PINVOYAGER__SERVER__BIND is set in the image to 0.0.0.0:8080. Override
      # it here only if you also override the image's HEALTHCHECK.
    ports:
      - "${API_PORT:-8080}:8080"
    # Allow time for HTTP and worker shutdown before Docker sends SIGKILL.
    # Each shutdown step can wait up to the configured shutdown timeout.
    stop_grace_period: 30s
    volumes:
      - uploads:/data

  jaeger:
    # All-in-one, transient in-memory storage: a small development trace viewer.
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    depends_on:
      jaeger:
        condition: service_started
    volumes:
      - ./dev/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"

volumes:
  pgdata:
  uploads:
