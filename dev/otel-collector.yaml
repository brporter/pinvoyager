# Development traces only. Jaeger receives OTLP over the Compose network.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 1s
exporters:
  otlp_http/jaeger:
    endpoint: http://jaeger:4318
    sending_queue:
      queue_size: 256
    retry_on_failure:
      max_elapsed_time: 30s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/jaeger]
