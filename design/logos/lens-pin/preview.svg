<text x="72" y="73" font-size="15" font-weight="600" letter-spacing="3">PINVOYAGER / DESIGN EXPLORATION 01</text>
<text x="72" y="153" font-size="60" font-weight="600" letter-spacing="-2">A lens. A horizon. A visited place.</text>
<text x="74" y="200" font-size="22" fill="#57524d">A simpler mark in six independent vector layers.</text>
<path d="M72 237H1528" stroke="#d9d6d2"/>
