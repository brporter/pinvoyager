    <circle cx="512" cy="512" r="334" fill="none" stroke="#adb0bc" stroke-width="12"/>
    <path d="M240 385A300 300 0 0 1 460 216" fill="none" stroke="#b9bcc7" stroke-width="18" stroke-linecap="round"/>
    <path d="M742 705A300 300 0 0 1 652 777" fill="none" stroke="#f5f4f2" stroke-width="14" stroke-linecap="round"/>
  </g>


  <g id="push-pin" transform="translate(528 472) rotate(24)">
    <path d="M-13-32H13L9 120 0 174-9 120Z" fill="#e1dfdc"/>
    <circle cy="-80" r="88" fill="#f27318"/>
  </g>

</svg>
