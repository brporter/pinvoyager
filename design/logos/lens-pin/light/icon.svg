<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="icon-title icon-desc">
  <title id="icon-title">PinVoyager — light scene</title>
  <desc id="icon-desc">A pale blue daytime sky and amber sun with eight short rays above layered sage and green mountains, framed by a black and grey camera lens with an orange map pin.</desc>

  <g id="sky">
    <rect width="1024" height="1024" fill="#deedf6"/>
  </g>


  <g id="sun" transform="translate(628 264)">
    <circle r="26" fill="#eeb447"/>
    <path d="M0-46V-36M32.53-32.53 25.46-25.46M46 0H36M32.53 32.53 25.46 25.46M0 46V36M-32.53 32.53-25.46 25.46M-46 0H-36M-32.53-32.53-25.46-25.46" fill="none" stroke="#eeb447" stroke-width="8" stroke-linecap="round"/>
  </g>


  <g id="background-mountain">
    <path d="M0 714C116 710 228 768 352 702L650 462Q704 418 752 466L920 634Q966 680 1024 630V1024H0Z" fill="#a5b9b3"/>
  </g>


  <g id="foreground-mountain">
    <path d="M0 728Q78 708 140 648L274 508Q316 464 358 510L584 740Q634 786 696 760L862 694Q940 666 1024 714V1024H0Z" fill="#617f68"/>
  </g>


  <g id="lens">
    <circle cx="512" cy="512" r="380" fill="none" stroke="#1b1817" stroke-width="44"/>
    <circle cx="512" cy="512" r="334" fill="none" stroke="#6e6963" stroke-width="12"/>
    <path d="M240 385A300 300 0 0 1 460 216" fill="none" stroke="#bcb8b3" stroke-width="18" stroke-linecap="round"/>
    <path d="M742 705A300 300 0 0 1 652 777" fill="none" stroke="#fafaf9" stroke-width="14" stroke-linecap="round"/>
  </g>


  <g id="push-pin" transform="translate(528 472) rotate(24)">
