<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 128 128" role="img" aria-labelledby="title desc"><title id="title">PinVoyager — dark Liquid Glass study</title><desc id="desc">Original Horizon Pin geometry with simulated frosted glass. Static design proposal, not a system-rendered icon.</desc><defs>
<g id="mark"><path d="M64 116S22 78 22 48a42 42 0 0 1 84 0c0 30-42 68-42 68Z" fill="none" stroke="white" stroke-width="8" stroke-linejoin="round"/>
<circle cx="77" cy="34" r="7" fill="white"/>
<path d="m34 66 19-22 19 22 12-13 13 13" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
<linearGradient id="background" x1="0" y1="0" x2="0.15" y2="1"><stop stop-color="#143e3b"/><stop offset="0.48" stop-color="#102b29"/><stop offset="1" stop-color="#081c1b"/></linearGradient>
<radialGradient id="ambient" cx=".5" cy="0" r=".95"><stop stop-color="white" stop-opacity=".14"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
<linearGradient id="glass" x1="0" y1="0" x2=".18" y2="1"><stop stop-color="#bbf2e5" stop-opacity=".98"/><stop offset=".3" stop-color="#6db7a9" stop-opacity=".80"/><stop offset=".56" stop-color="#a8e8de" stop-opacity=".94"/><stop offset="1" stop-color="#508b82" stop-opacity=".78"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white" stop-opacity=".98"/><stop offset=".55" stop-color="#e9fff8" stop-opacity=".65"/><stop offset="1" stop-color="white" stop-opacity=".25"/></linearGradient>
<mask id="shape" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128"><use href="#mark"/></mask>
<mask id="top-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128"><use href="#mark"/><g transform="translate(0 .65)" fill="black" stroke="black"><path d="M64 116S22 78 22 48a42 42 0 0 1 84 0c0 30-42 68-42 68Z" fill="none" stroke="black" stroke-width="8" stroke-linejoin="round"/>
<circle cx="77" cy="34" r="7" fill="black"/>
<path d="m34 66 19-22 19 22 12-13 13 13" fill="none" stroke="black" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></mask>
<mask id="bottom-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128"><use href="#mark"/><g transform="translate(0 -.7)"><path d="M64 116S22 78 22 48a42 42 0 0 1 84 0c0 30-42 68-42 68Z" fill="none" stroke="black" stroke-width="8" stroke-linejoin="round"/>
<circle cx="77" cy="34" r="7" fill="black"/>
<path d="m34 66 19-22 19 22 12-13 13 13" fill="none" stroke="black" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g></mask>
<filter id="lift" x="-.4" y="-.3" width="1.8" height="1.8" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="1.3"/><feOffset dy="1.7" result="shadowAlpha"/><feFlood flood-color="#032c28" flood-opacity=".42"/><feComposite in2="shadowAlpha" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="enclosure"><path d="M32 0H96C118 0 128 10 128 32V96C128 118 118 128 96 128H32C10 128 0 118 0 96V32C0 10 10 0 32 0Z"/></clipPath>
</defs><g clip-path="url(#enclosure)"><rect width="128" height="128" fill="url(#background)"/><rect width="128" height="128" fill="url(#ambient)"/><g transform="translate(16 16) scale(.75)" filter="url(#lift)">
<rect width="128" height="128" fill="url(#glass)" mask="url(#shape)"/>
<rect width="128" height="128" fill="#0c3f3c" opacity=".45" mask="url(#bottom-edge)"/>
<rect width="128" height="128" fill="url(#edge)" mask="url(#top-edge)"/>
</g></g></svg>